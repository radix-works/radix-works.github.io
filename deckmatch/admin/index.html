<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>デックマッチ管理画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 上に見出しとタブ、下にタブごとの中身。管理する人だけが Google でログインして使う */
:root {
  --bg: #f3f1ec; --panel: #fffdf8; --ink: #23201b; --sub: #6b655a; --line: #dcd6ca;
  --accent: #d2562b; --accent-soft: #fbe3d8; --ok: #2f8a4c; --ok-soft: #dcf0e2; --warn: #b8770f; --warn-soft: #fbedd2;
  --chip: #ebe7df; --shade: rgba(20,16,10,.45);
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #1b1916; --panel: #25221e; --ink: #f1ece2; --sub: #aaa293; --line: #3a362f;
  --accent: #f07a4c; --accent-soft: #4a2a1d; --ok: #6fcf8e; --ok-soft: #1f3a28; --warn: #f0b14e; --warn-soft: #43331a;
  --chip: #302c26; --shade: rgba(0,0,0,.6); color-scheme: dark } }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.6; padding-inline: 16px; padding-block: 0 48px }
[hidden] { display: none !important }
h1 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; letter-spacing: .02em }
h2 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 0 }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 18px 8px; max-width: 1200px; margin-inline: auto }
.who { margin-left: auto; display: flex; gap: 8px; align-items: center; color: var(--sub); font-size: 13px }
.tabs { display: flex; gap: 6px; max-width: 1200px; margin-inline: auto; border-bottom: 1px solid var(--line) }
.tab { font: inherit; font-weight: 700; border: 0; background: none; color: var(--sub); padding: 8px 14px; cursor: pointer; border-bottom: 3px solid transparent }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }
.page { max-width: 1200px; margin-inline: auto; padding-block: 14px }
.gate { max-width: 460px; margin: 60px auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 12px }
.btn { font: inherit; font-weight: 700; border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer; background: var(--chip); color: var(--ink) }
.btn.main { background: var(--accent); color: #fff }
.btn.small { padding: 4px 10px; font-size: 12px }
.btn:disabled { opacity: .5; cursor: default }
.btn:focus-visible, .chip:focus-visible, .tab:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
input[type=search], input[type=text], input[type=number], input[type=datetime-local], textarea, select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0 }
.note { background: var(--warn-soft); border-radius: 6px; padding: 8px 12px; font-size: 13px }
.msg { font-size: 13px; color: var(--sub) }
.err { color: var(--accent); font-weight: 700 }
.okmsg { color: var(--ok); font-weight: 700 }

/* メール */
.mailgrid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 18px; align-items: start }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.fld { display: flex; flex-direction: column; gap: 4px }
.fld label, .lab { font-size: 12px; color: var(--sub); font-weight: 700 }
.fld textarea { min-height: 6em; resize: vertical; line-height: 1.5 }
.gifts { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px }
.ggroup { display: flex; flex-direction: column; gap: 6px; padding-block: 6px; border-top: 1px dashed var(--line) }
.ggroup:first-child { border-top: 0 }
.ggroup h3 { margin: 0; font-size: 12px; color: var(--ink) }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.preview { border: 2px solid var(--ink); border-radius: 8px; background: var(--bg); padding: 12px }
.preview .t { font-weight: 700; font-size: 15px }
.preview .b p { margin: 4px 0 }
.preview .g { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px }
.pill { background: var(--chip); border-radius: 999px; padding: 1px 10px; font-size: 12px; font-variant-numeric: tabular-nums }
.list { display: flex; flex-direction: column; gap: 8px }
.item { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 4px }
.item .top { display: flex; gap: 8px; align-items: center }
.item .top b { flex: 1; min-width: 0 }
.item .meta { font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums }

/* タイル */
.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-block: 8px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px }
.bar .row .lab { min-width: 4.5em }
.bar input[type=search] { flex: 1 1 220px }
.filters { flex-wrap: wrap; gap: 8px }
.filters input[type=search] { flex: 1 1 200px; max-width: 320px }
.sel { display: flex; align-items: center; gap: 4px }
.sel .lab { min-width: 0 !important; white-space: nowrap }
.sel select.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 700 }
.chip { font: inherit; font-size: 13px; border: 1px solid transparent; background: var(--chip); color: var(--ink); padding: 3px 10px; border-radius: 999px; cursor: pointer }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg) }
.stats { color: var(--sub); font-variant-numeric: tabular-nums }
.stats b { color: var(--ink) }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; padding-block: 14px }
.card { position: relative; display: flex; flex-direction: column; gap: 6px; text-align: left; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; cursor: pointer }
.card:hover { border-color: var(--sub) }
.art { position: relative; border-radius: 6px; padding: 3px; background: linear-gradient(135deg, var(--r1), var(--r2), var(--r3), var(--r4), var(--r5, var(--r4))) }
.art img { display: block; width: 100%; aspect-ratio: 1; border-radius: 4px; background: #0002 }
.cost { position: absolute; left: 6px; top: 6px; min-width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: #1d1a16e6; color: #fff; font-family: var(--display); font-size: 14px }
.star { position: absolute; right: 6px; top: 6px; background: #1d1a16e6; color: #ffd76a; font-size: 11px; padding: 1px 6px; border-radius: 999px }
.nm { font-weight: 700; font-size: 15px; line-height: 1.3 }
.sh { color: var(--sub); font-size: 12px; line-height: 1.45 }
.tags { display: flex; flex-wrap: wrap; gap: 4px }
.tag { font-size: 11px; background: var(--chip); padding: 0 6px; border-radius: 4px; color: var(--sub) }
.flag { position: absolute; right: -6px; top: -6px; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; color: #fff }
.flag.ch { background: var(--accent) }
.flag.ok { background: var(--ok) }
.empty { color: var(--sub); padding: 40px 0; text-align: center }

/* 窓 */
.shade { position: fixed; inset: 0; background: var(--shade); z-index: 20 }
.sheet { position: fixed; z-index: 21; background: var(--panel); top: 0; right: 0; bottom: 0; width: min(560px, 100%); overflow-y: auto; padding: 16px 18px 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: -6px 0 24px #0003 }
.sheet .top { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: start }
.sheet .top > div { min-width: 0 }
.fld .was { font-size: 12px; color: var(--sub) }
.fld.changed input, .fld.changed textarea, .fld.changed select { border-color: var(--accent); background: var(--accent-soft) }
.acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; position: sticky; bottom: -24px; background: var(--panel); padding-block: 10px; border-top: 1px solid var(--line) }
.chk { display: flex; gap: 6px; align-items: center; font-weight: 700 }
.fld .chk { font-size: 15px; color: var(--ink) }
.fld.changed .chk { color: var(--accent) }
.sheet h3.sec { margin: 6px 0 -4px; font-size: 14px; border-top: 1px solid var(--line); padding-top: 12px }
.peers { display: flex; flex-direction: column; gap: 6px }
.peer { font: inherit; text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 8px 10px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px }
.peer:hover { border-color: var(--accent) }
.noart { display: grid; aspect-ratio: 1 / 1; border-radius: 4px; place-items: center; width: 100%; height: 100%; color: var(--sub); font-size: 13px; font-weight: 700; background: repeating-linear-gradient(45deg, var(--chip), var(--chip) 8px, var(--bg) 8px, var(--bg) 16px) }
.flag.nw { background: #2f7d5a; color: #fff }
.tablewrap { overflow: auto; max-height: calc(100vh - 140px); margin-block: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel) }
#tbl { border-collapse: separate; border-spacing: 0; font-size: 13px }
#tbl th { position: sticky; top: 0; z-index: 2; background: var(--chip); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; font-size: 12px }
#tbl td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; background: var(--panel) }
#tbl .sx { position: sticky; z-index: 1 }
#tbl th.sx { z-index: 3 }
#tbl .s1 { left: 0; width: 52px; min-width: 52px }
#tbl .s2 { left: 52px; min-width: 170px }
#tbl .s3 { left: var(--s3left, 224px); min-width: 56px; text-align: center; box-shadow: 2px 0 0 var(--line); font-size: 11px; line-height: 1.2 }
#tbl .s2 input { width: 160px; font-weight: 700 }
.tart { width: 40px; padding: 2px }
.tart .noart { font-size: 9px }
#tbl textarea { display: block; height: 32px; min-height: 32px; resize: none; overflow: hidden; white-space: nowrap; line-height: 1.45; padding: 5px 7px }
#tbl tr:focus-within textarea { white-space: pre-wrap; overflow: auto }
#tbl tr:focus-within td { background: var(--accent-soft) }
#tbl .c-short textarea { width: 200px } #tbl .c-text textarea { width: 300px } #tbl .c-stageText textarea { width: 240px } #tbl .c-note textarea { width: 220px }
#tbl .c-cost input { width: 4.5em }
#tbl .c-solo, #tbl .c-quiet, #tbl .c-done { text-align: center }
#tbl input[type=checkbox] { width: 18px; height: 18px; margin-top: 7px }
#tbl .c-stat { white-space: nowrap; font-variant-numeric: tabular-nums }
#tbl .c-act { position: sticky; right: 0; z-index: 1; white-space: nowrap }
#tbl th.c-act { z-index: 3 }
#tbl .ro { display: inline-block; padding-top: 6px; color: var(--sub); white-space: nowrap }
#tbl td.diff input, #tbl td.diff textarea, #tbl td.diff select { border-color: var(--accent) }
#tbl td.dirty input:not([type=checkbox]), #tbl td.dirty textarea, #tbl td.dirty select { background: var(--warn-soft) }
#tbl td.dirty input[type=checkbox] { outline: 3px solid var(--warn); outline-offset: 1px }
#tbl tr.dirtyrow .s2 { box-shadow: inset 4px 0 0 var(--warn) }
/* スマホでは左の固定をやめて、全部の列を一緒に横へ流す（2026-10-08 ユーザー指定「スマホで管理画面を開いてタイルの一覧表示をしたとき、左の固定をなくして全部スクロールできるようにして」） */
@media (max-width: 700px) {
  #tbl td.sx { position: static }
  #tbl th.sx { left: auto }
  #tbl .s2, #tbl .s3, #tbl tr.dirtyrow .s2 { box-shadow: none }
  #tbl tr.dirtyrow .s1 { box-shadow: inset 4px 0 0 var(--warn) }
}
.rowmeta { display: flex; gap: 8px; align-items: center; margin-top: 3px }
/* 「新しいタイル」「詳しく」「複製」「消す」を途中で折り返さない（2026-10-10 ユーザー指定「ここ改行されるのやめて」） */
.rowmeta > * { white-space: nowrap; flex: none }
.flag-in { font-size: 11px; font-weight: 700; color: #2f7d5a }
.lnk { font: inherit; font-size: 12px; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline }
[data-drag] { cursor: grab; touch-action: none }
body.dragmode, body.dragmode * { cursor: grabbing !important; user-select: none }
.dragging { opacity: .45 }
#tbl tr.dropbefore td { box-shadow: inset 0 3px 0 var(--accent) }
#tbl tr.dropafter td { box-shadow: inset 0 -3px 0 var(--accent) }
.card.dropbefore { box-shadow: -4px 0 0 var(--accent) }
.card.dropafter { box-shadow: 4px 0 0 var(--accent) }
.card .sc { font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; font-weight: 700 }
.sgrid { display: flex; flex-direction: column; gap: 4px }
.srow { display: grid; grid-template-columns: 11em 5em 1fr; gap: 8px; align-items: baseline; border-bottom: 1px dashed var(--line); padding: 3px 0 }
.srow b { font-variant-numeric: tabular-nums; text-align: right }
.srow .msg { margin: 0; font-size: 12px }
.peer .pc { font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums }
.peer .ps, .peer .pm { grid-column: 1 / -1; font-size: 13px; color: var(--sub) }
.peer .pm { font-size: 12px }
.info { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--sub) }
.confirm { position: fixed; z-index: 31; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100% - 32px)); background: var(--panel); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 40px #0005 }
.confirm-shade { position: fixed; inset: 0; background: var(--shade); z-index: 30 }

@media (max-width: 760px) { .mailgrid { grid-template-columns: 1fr } }
@media (max-width: 520px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px }
  .sheet { top: 8%; width: 100%; border-radius: 14px 14px 0 0 }
  .sheet .top { grid-template-columns: 84px 1fr }
  .two { grid-template-columns: 1fr }
}
</style>
</head>
<body>
<div class="head">
  <h1>デックマッチ管理画面</h1>
  <div class="who" id="who"></div>
</div>

<div class="gate" id="gate">
  <h2>ログイン</h2>
  <p class="msg" id="gateMsg">読み込み中…</p>
  <button class="btn main" id="loginBtn" hidden>Google でログイン</button>
</div>

<div id="app" hidden>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="mail" aria-selected="true">メール</button>
    <button class="tab" role="tab" data-tab="tiles" aria-selected="false">タイル見直し</button>
  </div>

  <!-- メール -->
  <section class="page" id="tab-mail">
    <div class="mailgrid">
      <div class="box">
        <h2>メールを出す</h2>
        <div class="fld">
          <span class="lab">あて先</span>
          <div class="row">
            <label class="chk"><input type="radio" name="to" value="all" id="toAll" checked> 全員</label>
            <label class="chk"><input type="radio" name="to" value="one" id="toOne"> 1人だけ</label>
            <input type="text" id="toCode" placeholder="フレンドコード（8 文字）" maxlength="8" hidden>
            <span class="msg" id="toName"></span>
          </div>
        </div>
        <div class="fld"><label for="mTitle">見出し（40 文字まで）</label><input type="text" id="mTitle" maxlength="40" placeholder="例：不具合のおわび"></div>
        <div class="fld"><label for="mText">本文（改行で段落が分かれます）</label><textarea id="mText" placeholder="例：一部の画面で表示が乱れる不具合がありました。&#10;おわびとして、ジェムをお届けします。"></textarea></div>
        <div class="fld">
          <span class="lab">配る物（配らないものは空のまま）</span>
          <div id="giftHost"></div>
        </div>
        <div class="two">
          <div class="fld"><label for="mFrom">出し始め（空ならすぐ）</label><input type="datetime-local" id="mFrom"></div>
          <div class="fld"><label for="mUntil">出し終わり（空ならずっと）</label><input type="datetime-local" id="mUntil"></div>
        </div>
        <div class="fld">
          <span class="lab">見え方</span>
          <div class="preview" id="preview"></div>
        </div>
        <div class="row">
          <button class="btn main" id="sendBtn">送る</button>
          <span class="msg" id="sendMsg"></span>
        </div>
      </div>

      <div class="box">
        <div class="row"><h2 style="flex:1">送った履歴</h2><button class="btn small" id="reloadAll">読み直す</button></div>
        <div class="row" id="histFilter"><button class="chip" data-f="all" aria-pressed="true">すべて</button><button class="chip" data-f="everyone" aria-pressed="false">全員へ</button><button class="chip" data-f="one" aria-pressed="false">1人へ</button><span class="msg" id="histCount"></span></div>
        <div class="list" id="allList"><p class="msg">読み込み中…</p></div>
        <div class="row"><h2 style="flex:1">1人へのメールを見る</h2></div>
        <div class="row"><input type="text" id="lookCode" placeholder="フレンドコード（8 文字）" maxlength="8"><button class="btn small" id="lookBtn">見る</button><span class="msg" id="lookName"></span></div>
        <div class="list" id="oneList"></div>
        <p class="msg">取り消すと、まだ受け取っていない人のメールBOXには入らなくなります。もう受け取った人の配る物は戻りません。</p>
      </div>
    </div>
  </section>

  <!-- タイル見直し -->
  <section class="page" id="tab-tiles" hidden>
    <div class="stats" id="stats">読み込み中…</div>
    <div class="bar">
      <div class="row"><span class="lab">成績の期間</span>
        <select id="sPeriod" aria-label="成績の期間"><option value="7">7 日</option><option value="30" selected>30 日</option><option value="90">90 日</option><option value="0">ぜんぶ</option></select>
        <span class="lab">戦い</span><span id="fMode" class="row"></span>
        <button class="btn small" id="sReload">読み直す</button></div>
      <div class="msg" id="sMsg">成績を読み込み中…</div>
    </div>
    <div class="bar">
      <div class="row"><span class="lab">表示</span><span id="fView" class="row"></span><span id="bulkBox" class="row" hidden><button class="btn main small" id="bulkSave">まとめて保存</button><button class="btn small" id="bulkUndo">保存していない変更を取り消す</button></span></div>
      <div class="row"><button class="btn main small" id="newTile">＋ 新しいタイル</button><button class="btn small" id="orderBtn">注文を出力</button><button class="btn small" id="importBtn">返事を取り込む</button></div>
      <div class="row filters"><input type="search" id="q" placeholder="名前・説明で探す">
        <label class="sel"><span class="lab">レアリティ</span><select id="fStar"></select></label>
        <label class="sel"><span class="lab">種類</span><select id="fCat"></select></label>
        <label class="sel"><span class="lab">使いどころ</span><select id="fScope"></select></label>
        <label class="sel"><span class="lab">印</span><select id="fMark"></select></label>
        <label class="sel"><span class="lab">状態</span><select id="fState"></select></label>
        <label class="sel"><span class="lab">並び</span><select id="sort"><option value="star">レアリティ順</option><option value="cost">コスト順</option><option value="cat">種類順</option><option value="name">名前順</option><option value="useRate">使用率順</option><option value="pickRate">採用率順</option><option value="useWin">使った試合の勝率順</option></select></label></div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="msg" id="tableHelp" hidden>横にスクロールすると全部の項目があります。オレンジの枠は、いまのゲームから変えた項目です。黄色は、まだ保存していない項目です。行の「保存」か、上の「まとめて保存」で保存されます。</p>
    <div class="tablewrap" id="tableWrap" hidden><table id="tbl"><thead></thead><tbody></tbody></table></div>
    <div class="empty" id="empty" hidden>当てはまるタイルがありません</div>
  </section>
</div>
<div id="layer"></div>

<script src="fb.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const FB = window.FB;
const ADMINS = ['nemoto.rmk@gmail.com'];
let started = false;

/* ---------- ログイン ---------- */
$('loginBtn').onclick = () => FB.signIn().catch((e) => { $('gateMsg').innerHTML = `<span class="err">ログインできませんでした（${esc(e.code || e.message)}）</span>`; });
FB.onUser((u) => {
  if (!u) {
    $('app').hidden = true; $('gate').hidden = false; $('loginBtn').hidden = false; $('who').innerHTML = '';
    $('gateMsg').textContent = '管理する人の Google アカウントでログインしてください。';
    return;
  }
  $('who').innerHTML = `<span>${esc(u.email)}</span><button class="btn small" id="outBtn">ログアウト</button>`;
  $('outBtn').onclick = () => FB.signOut();
  if (!ADMINS.includes(u.email) || !u.emailVerified) {
    $('app').hidden = true; $('gate').hidden = false; $('loginBtn').hidden = true;

function ask(title, lines, okLabel) {

    const done = (v) => { shade.remove(); box.remove(); resolve(v); };
    shade.onclick = () => done(false);

    // 一覧で編集のときに打っている途中なら、行を作り直さない（打っている文字と位置を守る）
    if (f.view === 'table' && document.activeElement?.closest('#tbl')) refreshRows(); else render();
  }, (e) => { $('stats').innerHTML += ` <span class="err">書き換えを読み込めませんでした（${esc(e.code || e.message)}）</span>`; });
}
</script>
</body>
</html>
