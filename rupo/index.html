<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ルポる プロトタイプ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#1b2436; --sub:#5b6579; --line:#e3e7ee; --bg:#f4f6f9; --paper:#fff;
  --accent:#ff6a3d; --accent-d:#e4521f; --me:#2f6bff; --gray:#aeb6c4; --ok:#1f9d6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#dfe4ec;color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;line-height:1.6;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100dvh;max-width:520px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
header{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--paper);border-bottom:1px solid var(--line);z-index:900}
.logo{font-weight:800;font-size:20px;letter-spacing:.02em}
.logo b{color:var(--accent)}
.badge-proto{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.confi-chip{font-size:12px;font-weight:700;background:#fff4ef;color:var(--accent-d);border-radius:99px;padding:3px 10px}
main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none;overflow:auto}
.view.on{display:block}
#view-map{overflow:hidden}
#map{position:absolute;inset:0;isolation:isolate;background:#f1f3f6}
#map .leaflet-tile-pane{filter:grayscale(.6) contrast(.9) brightness(1.06)}
nav{flex:none;display:flex;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:900}
nav button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:1px}
nav button .i{font-size:20px;line-height:1.1;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--ink);font-weight:700}
nav button.on .i{filter:none;opacity:1}

/* map overlays */
.fab{position:absolute;right:12px;z-index:600;border:0;background:var(--paper);box-shadow:0 2px 10px rgba(20,30,50,.22);border-radius:50%;width:44px;height:44px;font-size:20px}
#btn-locate{bottom:16px}
#btn-add{bottom:68px;background:var(--accent);color:#fff;font-weight:700;font-size:26px;line-height:1}
.chip{pointer-events:auto;align-self:center;z-index:600;background:rgba(27,36,54,.88);color:#fff;font-size:12px;padding:6px 14px;border-radius:99px;max-width:92%;text-align:center;display:none}
.chip.on{display:block}
.chip button{background:none;border:0;color:#ffd2c4;text-decoration:underline;padding:0 0 0 6px}
.sp-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.sp-tags span.m{background:var(--ink);color:#fff}
.sp-tags span.sm{background:#fff4e5;color:#8a4b00}
.sp-tags span{background:#eef1f6;color:var(--sub);font-size:11px;font-weight:700;border-radius:6px;padding:0 7px}
.legend{position:absolute;left:10px;bottom:14px;z-index:600;background:rgba(255,255,255,.94);border-radius:10px;padding:6px 10px;font-size:11px;color:var(--sub);box-shadow:0 1px 6px rgba(20,30,50,.16)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:4px}

/* pins */
.pin{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--c);border:2.5px solid #fff;box-shadow:0 2px 8px rgba(20,30,50,.35);display:flex;align-items:center;justify-content:center}
.pin span{transform:rotate(45deg);font-size:16px}
.pin.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:rotate(-45deg) scale(.2);filter:grayscale(1)}100%{transform:rotate(-45deg) scale(1)}}
.gpin{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.9);border:2px dashed var(--gray)}
.mepin{width:22px;height:22px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,107,255,.22),0 2px 8px rgba(0,0,0,.3)}
.leaflet-tooltip{font-family:inherit;font-size:12px;border-radius:8px;border:0;box-shadow:0 2px 8px rgba(0,0,0,.2);padding:3px 8px}

#cross{position:absolute;left:50%;top:50%;width:0;height:0;z-index:700;display:none;pointer-events:none}
#cross.on{display:block}
#cross i{position:absolute;left:-18px;top:-58px;font-style:normal;font-size:40px;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
#placebar{position:absolute;left:12px;right:12px;bottom:14px;z-index:850;background:var(--paper);border-radius:14px;padding:12px;box-shadow:0 4px 18px rgba(20,30,50,.3);display:none}
#placebar.on{display:block}
#placebar p{margin:0 0 8px;font-size:13px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sw input{width:22px;height:22px;accent-color:var(--accent)}
.pos{border:1.5px dashed var(--accent);border-radius:12px;padding:10px 12px;background:#fff8f5;margin:12px 0}
.pos b.t{font-size:14px}
.pos .bars{display:flex;height:10px;border-radius:9px;overflow:hidden;background:var(--line);margin:8px 0 4px}
.pos .bars i{display:block;height:100%}
.pos .bars .a{background:#8d97aa}
.pos .bars .b{background:var(--accent)}
.pos .nums{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.pos .row{margin:8px 0 0;flex-wrap:wrap}
.pos-note{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--sub);margin:10px 0}
#topbar{position:absolute;left:0;right:0;top:8px;z-index:650;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.wards{pointer-events:auto;display:flex;gap:6px;padding:0 10px 4px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.wards.main button{font-size:13px;padding:6px 13px}
.wards.sub button{background:rgba(255,255,255,.88);font-weight:600;box-shadow:0 1px 4px rgba(20,30,50,.18)}
.wards.sub button.on{background:var(--accent);color:#fff}
.wards.ward button{font-size:11px;padding:4px 10px;opacity:.92}
.wards::-webkit-scrollbar{display:none}
.wards button{flex:none;border:0;background:rgba(255,255,255,.96);box-shadow:0 1px 6px rgba(20,30,50,.25);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--ink)}
.wards button.on{background:var(--ink);color:#fff}
/* sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:800;background:var(--paper);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(20,30,50,.22);max-height:78%;overflow:auto;transform:translateY(105%);transition:transform .28s ease;padding:6px 16px 22px}
#sheet.on{transform:none}
.grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sp-head{display:flex;gap:10px;align-items:flex-start}
.sp-ico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--c);flex:none}
.sp-name{font-size:18px;font-weight:800;line-height:1.35}
.sp-meta{font-size:12px;color:var(--sub)}
.x{margin-left:auto;border:0;background:var(--bg);width:30px;height:30px;border-radius:50%;flex:none}
.stats{display:flex;gap:6px;margin:12px 0}
.stat{flex:1;background:var(--bg);border-radius:10px;padding:7px 4px;text-align:center;font-size:11px;color:var(--sub)}
.stat b{display:block;font-size:17px;color:var(--ink)}
.main-info{border:1.5px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fffdf7;position:relative}
.main-info .tag{position:absolute;top:-10px;left:12px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;padding:1px 10px;border-radius:99px}
.empty{background:var(--bg);border-radius:12px;padding:14px;color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;margin:12px 0}
.btn{flex:1;border:1.5px solid var(--ink);background:var(--paper);border-radius:12px;padding:10px 6px;font-weight:700;font-size:14px;box-shadow:0 2px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.pri{background:var(--accent);border-color:var(--accent-d);box-shadow:0 2px 0 var(--accent-d);color:#fff}
.btn.sm{flex:none;padding:6px 12px;font-size:12px;box-shadow:0 1.5px 0 var(--ink)}
.btn[disabled]{opacity:.45;box-shadow:none}
.link{background:none;border:0;color:var(--sub);font-size:12px;text-decoration:underline;padding:4px 0}
h3{font-size:13px;color:var(--sub);margin:16px 0 6px;letter-spacing:.04em}

/* report card */
.rp{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.sheet .rp,#sheet .rp{background:var(--bg);border-color:transparent}
.rp-top{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.av{width:24px;height:24px;border-radius:50%;background:var(--c,#cbd3e1);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex:none}
.rp-user{font-weight:700;color:var(--ink)}
.cf{font-size:10px;background:#fff4ef;color:var(--accent-d);border-radius:99px;padding:0 7px;font-weight:700}
.rp-body{margin:6px 0 4px;white-space:pre-wrap;word-break:break-word}
.rp img{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin:4px 0}
.rp-foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.tg{background:#eaf0ff;color:#2a4fb8;border-radius:6px;padding:0 6px;font-size:11px;font-weight:700}
.kime{margin-left:auto;color:var(--accent-d);font-weight:800}
.tl-spot{font-weight:800;font-size:14px}
.pad{padding:14px}
.tl-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.tl-head b{font-size:17px}
.tl-head span{font-size:12px;color:var(--sub)}

/* modal */
#modal{position:absolute;inset:0;z-index:1000;background:rgba(15,22,36,.5);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.mbox{background:var(--paper);width:100%;border-radius:18px 18px 0 0;padding:16px 16px 22px;max-height:92%;overflow:auto}
.mbox h2{font-size:17px;margin:0 0 4px}
.mbox p{margin:4px 0;color:var(--sub);font-size:13px}
textarea,input[type=text],select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:96px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px;font-size:13px}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.warn{background:#fff4e5;border-radius:10px;padding:10px;font-size:13px;color:#8a4b00;margin:8px 0}
.good{background:#e9f8f1;border-radius:10px;padding:10px;font-size:13px;color:#14704b;margin:8px 0}
.ring{width:140px;height:140px;margin:10px auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
.big{font-size:42px;text-align:center;margin:6px 0}
.pick{width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:block}
.pick:active{border-color:var(--accent)}
.pick .go{display:block;margin-top:6px;text-align:right;color:var(--accent-d);font-weight:800}

/* me */
.hero{background:var(--ink);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.hero .rank{font-size:12px;opacity:.75}
.hero .nm{font-size:20px;font-weight:800}
.hero .pt{font-size:34px;font-weight:800;color:#ffb199;line-height:1.1}
.hero .pt small{font-size:12px;color:#fff;opacity:.75;margin-left:4px}
.bar{height:8px;background:rgba(255,255,255,.18);border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#ffb199}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.card h4{margin:0 0 6px;font-size:14px}
.sim label{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:8px}
.sim input[type=range]{width:100%;accent-color:var(--accent)}
.sim table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.sim td{padding:5px 0;border-top:1px solid var(--line)}
.sim td:last-child{text-align:right;font-weight:700}
.note{font-size:11px;color:var(--sub)}
#toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:12px;font-size:13px;z-index:1100;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">ルポ<b>る</b></div>
    <span class="badge-proto">PROTOTYPE</span>
    <span class="confi-chip" id="hd-confi">コンフィ 0</span>
  </header>
  <main>
    <section class="view on" id="view-map">
      <div id="map"></div>
      <div id="topbar"><div class="wards main" id="mains"></div><div class="wards sub" id="subs"></div><div class="wards ward" id="wards"></div><div class="chip" id="chip"></div></div>
      <div class="legend"><i style="background:#fff;border:2px dashed #aeb6c4"></i>ルポ待ち　<i style="background:var(--accent)"></i>ルポ済み</div>
      <div id="cross"><i>📍</i></div>
      <div id="placebar"><p><b id="pl-msg">地図を動かして、中央の📍を作りたい場所に合わせてください</b></p><div class="row" style="margin:0"><button class="btn" id="pl-x">やめる</button><button class="btn pri" id="pl-ok">ここに作る</button></div></div>
      <button class="fab" id="btn-add" title="新しいスポットを作る">＋</button>
      <button class="fab" id="btn-locate" title="現在地">◎</button>
    </section>
    <section class="view" id="view-tl"><div class="pad" id="tl"></div></section>
    <section class="view" id="view-me"><div class="pad" id="me"></div></section>
    <div id="sheet"></div>
    <div id="modal"></div>
    <div id="toast"></div>
  </main>
  <nav>
    <button data-v="map" class="on"><span class="i">🗺️</span>マップ</button>
    <button data-v="tl"><span class="i">📝</span>タイムライン</button>
    <button data-v="me"><span class="i">👤</span>マイページ</button>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
'use strict';

/* ===== 設定 ===== */
const HOME = {lat:35.7442, lng:139.7112};        // 北池袋あたり
const ARRIVE_M = 100;                            // 到着とみなす距離(m)
const FIRST_REPORT_M = 150;                      // 最初のルポを書けるのは、訪れた場所からこの距離(m)以内
const VISIT_DAYS = 7;                            // 訪れてから何日以内の場所に作れるか
const DWELL_SEC = 8;                             // 滞在秒数（本番は60秒）
const KIME_CONFI = 10;                           // 「決めた！」1回で上がるコンフィ
const DIVERGE_M = 30;                            // この距離(m)以上ずれた位置の提案は、みんなで確認する
const NEED_VOTES = 5;                            // 決着に必要な最低票数
const ADOPT_RATIO = 2/3;                         // 採用に必要な票の割合
const TIE_VOTES = 10;                            // この票数でも決まらないときは、元の位置のまま
const COOLDOWN_DAYS = 30;                        // 決着後、再提案できない日数
const POS_CONFI = 20;                            // 提案が採用されたときに上がるコンフィ
const OWNER_MAIN_MAX = 3;                        // オーナーが広げられるメインタグの数（みんなが決めた1つを含む）
const ATTRS = {   // お店の条件：到着した人の回答で決まる
  smoke:  {title:'喫煙ルール', ico:'🚬', unk:'喫煙：未登録',   all:'🚬 喫煙：指定なし',   opts:{no:'🚭 禁煙',sep:'分煙（喫煙席あり）',yes:'🚬 喫煙可'}},
  smokeKind:{title:'喫煙の種類（分煙・喫煙可の場合）', ico:'💨', unk:'種類：未登録', all:'💨 種類：指定なし', opts:{e:'💨 電子たばこのみ',paper:'🚬 紙たばこOK'},
             when: sp => sp.smoke==='sep' || sp.smoke==='yes'},
  parking:{title:'駐車場',     ico:'🅿️', unk:'駐車場：未登録', all:'🅿️ 駐車場：指定なし', opts:{own:'🅿️ 駐車場あり',partner:'🤝 提携駐車場',none:'🚫 駐車場なし'}}
};
const ATTR_KEYS = Object.keys(ATTRS);
const attrLabel = (k,v) => ATTRS[k].opts[v] || ATTRS[k].unk;
const KIND_SHORT = {e:'電子のみ',paper:'紙OK'};
function smokeText(sp){   // 例：「分煙・電子のみ」「🚬 喫煙可・紙OK」
  if(!sp.smoke) return ATTRS.smoke.unk;
  const base=ATTRS.smoke.opts[sp.smoke].replace('（喫煙席あり）','');
  return sp.smoke!=='no' && sp.smokeKind ? `${base}・${KIND_SHORT[sp.smokeKind]}` : base;
}
function attrActive(sp,k,forAsk){   // 喫煙の種類は、分煙・喫煙可のお店だけ
  const w=ATTRS[k].when; if(!w) return true;
  if(w(sp)) return true;
  return !!forAsk && ((sp.av&&sp.av.smoke&&sp.av.smoke.votes)||[]).some(v=>v.user===S.me && (v.v==='sep'||v.v==='yes'));
}
function fixSmoke(sp){   // 旧データの「電子のみ」を、新しい2段階の分類に直す
  if(sp.smoke==='e'){ sp.smoke='yes'; sp.smokeKind='e'; }
  if(sp.av && sp.av.smoke) sp.av.smoke.votes.forEach(x=>{ if(x.v==='e') x.v='yes'; });
  if((sp.smoke==='sep'||sp.smoke==='yes') && sp.smokeKind===undefined && sp.demo){
    sp.smokeKind=((sp.id.length+sp.id.charCodeAt(sp.id.length-1))%2)?'e':'paper';
  }
  if(sp.smoke==='no') sp.smokeKind=null;
}
const MAX_TAGS = 6;                              // 1つのスポットに付けられるタグの数
const KEY = 'rupo-proto-v1';

/* メインタグ（1つ）とサブタグ（複数） */
const MAINS = {
  eat:    {e:'🍽️', l:'飲食店',     c:'#ff8a5b', subs:['ラーメン','定食・食堂','和食','洋食','中華','カフェ','居酒屋・バー','パン・スイーツ','ファストフード']},
  shop:   {e:'🛍️', l:'買い物',     c:'#6c8cff', subs:['コンビニ','スーパー','服','雑貨','ドラッグストア','百貨店・モール','酒・食品']},
  culture:{e:'📚',  l:'本・文化',   c:'#7a6cd6', subs:['書店','図書館','美術館・博物館','映画館']},
  park:   {e:'🌳',  l:'公園・自然', c:'#4cb782', subs:['公園','庭園']},
  fun:    {e:'🎬',  l:'遊び',       c:'#3fb6c9', subs:['カラオケ','ゲーム','劇場']},
  relax:  {e:'♨️',  l:'癒し・運動', c:'#e07a7a', subs:['銭湯','ジム']},
  other:  {e:'📍',  l:'その他',     c:'#8d97aa', subs:[]}
};
const CATS = MAINS;
const SUBE = {'ラーメン':'🍜','定食・食堂':'🍚','和食':'🍣','洋食':'🍝','中華':'🥟','カフェ':'☕','居酒屋・バー':'🍺','パン・スイーツ':'🍰','ファストフード':'🍔',
  'コンビニ':'🏪','スーパー':'🛒','服':'👕','雑貨':'🎁','ドラッグストア':'💊','百貨店・モール':'🏬','酒・食品':'🍶',

function dist(a,b){
  const R=6371000, r=Math.PI/180;
  const dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtD = m => m<1000 ? Math.round(m/10)*10+'m' : (m/1000).toFixed(1)+'km';
function ago(t){
  const s=(Date.now()-t)/1000;
  if(s<60) return 'たった今';
  if(s<3600) return Math.floor(s/60)+'分前';
  if(s<86400) return Math.floor(s/3600)+'時間前';
  return Math.floor(s/86400)+'日前';
}
function toast(msg){

function syncMarkers(){
  const all = new Map();
  cands.forEach((v,k)=>all.set(k,v));
  Object.keys(S.spots).forEach(k=>all.set(k,S.spots[k]));
  markers.forEach((m,id)=>{ const sp=all.get(id); if(!sp||!matches(sp)){ (m.real?cLayer:gLayer).removeLayer(m.m); markers.delete(id); } });
  all.forEach((sp,id)=>{
    if(!matches(sp)) return;                 // 選んだジャンルのスポットだけを出す
    const real=isReal(id), key=(real?'r':'g')+sp.cat+((sp.subs||[])[0]||'');
    let m=markers.get(id);
    if(m && m.key!==key){ (m.real?cLayer:gLayer).removeLayer(m.m); markers.delete(id); m=null; }
    if(!m){
      const mk=L.marker([sp.lat,sp.lng],{icon:iconFor(sp,real,popId===id)});
      mk.bindTooltip(esc(sp.name),{direction:'top',offset:[0,real?-30:-6]});
      mk.on('click',()=>openSheet(id));
      (real?cLayer:gLayer).addLayer(mk);
      markers.set(id,{m:mk,key,real});
    }
  });
  popId=null;
}

/* OSM(Overpass)からお店の候補を取得 */
const ENDPOINTS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
let fetched=[], loading=false, failed=false;
function classify(t){
  const a=t.amenity, sh=t.shop, l=t.leisure, to=t.tourism, cu=t.cuisine||'';
  if(a==='cafe') return {cat:'eat',subs:['カフェ']};
  if(a==='restaurant'||a==='food_court'){
    const subs=[];
    if(/ramen/.test(cu)) subs.push('ラーメン');
    if(/chinese/.test(cu)) subs.push('中華');
    if(/japanese|sushi|udon|soba|yakitori|tempura|tonkatsu|unagi|okonomiyaki|izakaya/.test(cu)) subs.push('和食');
    if(/italian|french|pizza|steak|american|spanish|german|burger/.test(cu)) subs.push('洋食');
    return {cat:'eat',subs};
  }
  if(a==='fast_food') return {cat:'eat',subs:['ファストフード']};
  if(['bar','pub','izakaya'].includes(a)) return {cat:'eat',subs:['居酒屋・バー']};
  if(a==='ice_cream'||['bakery','confectionery'].includes(sh)) return {cat:'eat',subs:['パン・スイーツ']};
  if(sh==='books') return {cat:'culture',subs:['書店']};
  if(a==='library') return {cat:'culture',subs:['図書館']};
  if(['museum','gallery'].includes(to)) return {cat:'culture',subs:['美術館・博物館']};
  if(a==='cinema') return {cat:'culture',subs:['映画館']};
  if(l==='park') return {cat:'park',subs:['公園']};
  if(l==='garden') return {cat:'park',subs:['庭園']};
  if(a==='karaoke_box') return {cat:'fun',subs:['カラオケ']};
  if(l==='amusement_arcade') return {cat:'fun',subs:['ゲーム']};
  if(a==='theatre') return {cat:'fun',subs:['劇場']};
  if(to==='attraction') return {cat:'fun',subs:[]};
  if(a==='public_bath') return {cat:'relax',subs:['銭湯']};
  if(l==='fitness_centre') return {cat:'relax',subs:['ジム']};
  if(sh==='convenience') return {cat:'shop',subs:['コンビニ']};
  if(sh==='supermarket') return {cat:'shop',subs:['スーパー']};
  if(sh==='clothes') return {cat:'shop',subs:['服']};
  if(['drugstore','cosmetics'].includes(sh)) return {cat:'shop',subs:['ドラッグストア']};
  if(['department_store','mall'].includes(sh)) return {cat:'shop',subs:['百貨店・モール']};
  if(sh==='alcohol') return {cat:'shop',subs:['酒・食品']};
  if(['variety_store','electronics'].includes(sh)) return {cat:'shop',subs:['雑貨']};
  if(sh) return {cat:'shop',subs:[]};
  return {cat:'other',subs:[]};
}
function inside(b,f){ return b.s>=f.s&&b.n<=f.n&&b.w>=f.w&&b.e<=f.e; }
async function loadSpots(force){
  if(map.getZoom()<16||loading) return;
  const bb=map.getBounds(), padLat=(bb.getNorth()-bb.getSouth())*.25, padLng=(bb.getEast()-bb.getWest())*.25;
  const b={s:bb.getSouth()-padLat,n:bb.getNorth()+padLat,w:bb.getWest()-padLng,e:bb.getEast()+padLng};
  if(!force && fetched.some(f=>inside({s:bb.getSouth(),n:bb.getNorth(),w:bb.getWest(),e:bb.getEast()},f))) return;
  loading=true; setChip('お店の位置を読み込み中…');
  const bx=`(${b.s},${b.w},${b.n},${b.e})`;
  const q=`[out:json][timeout:25];(`+
    `nwr["name"][!"industrial"][!"craft"]["amenity"~"^(restaurant|cafe|fast_food|bar|pub|izakaya|food_court|ice_cream|cinema|library|public_bath|karaoke_box|theatre)$"]${bx};`+
    `nwr["name"][!"industrial"][!"craft"]["shop"~"^(bakery|books|convenience|supermarket|clothes|variety_store|confectionery|alcohol|department_store|mall|electronics|cosmetics|drugstore)$"]${bx};`+
    `nwr["name"][!"industrial"][!"craft"]["leisure"~"^(park|garden|fitness_centre|amusement_arcade)$"]${bx};`+
    `nwr["name"][!"industrial"][!"craft"]["tourism"~"^(museum|gallery|attraction)$"]${bx};`+
    `);out center 500;`;
  let data=null;
  for(const ep of ENDPOINTS){
    try{
      const r=await fetch(ep,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}});
      if(!r.ok) throw 0; data=await r.json(); break;
    }catch(e){}
  }
  loading=false;
  if(!data){ failed=true; setChip('お店の位置を取得できませんでした（デモのスポットのみ表示）<button id="retry">再読み込み</button>'); const rb=$('#retry'); if(rb) rb.onclick=()=>loadSpots(true); return; }
  failed=false; fetched.push(b);
  let n=0;
  for(const el of data.elements){
    const lat=el.lat??(el.center&&el.center.lat), lng=el.lon??(el.center&&el.center.lon);
    if(lat==null||!el.tags||!el.tags.name) continue;
    const id='osm:'+el.type+'/'+el.id;
    if(cands.has(id)||S.spots[id]) continue;
    const k=classify(el.tags), sm=el.tags.smoking||'';

function resizePhoto(file){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const k=Math.min(1,640/Math.max(img.width,img.height)), cv=document.createElement('canvas');
        cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',.72));
      };
      img.onerror=()=>res(null); img.src=fr.result;
    };
    fr.onerror=()=>res(null); fr.readAsDataURL(file);
  });
}

/* ===== ピンの位置：提案 → 到着した人が確認 → 正確なほうを採用 ===== */
const MOCKS=['ミナト','ハナ','ソウタ','リン','ケン','ユイ','タクミ','サキ','レン'];
['ユイ','タクミ','サキ','レン'].forEach((u,i)=>{ if(!S.users[u]) S.users[u]={confi:[60,25,130,10][i]}; });
const vw = u => 1+Math.min(conf(u)/200,1);          // 票の重さ：コンフィが高いほど少し重い（1〜2倍）
function posState(sp){
  const v=sp.prop.votes; let a=0,b=0;
  v.forEach(x=>{ if(x.side==='B') b+=vw(x.user); else a+=vw(x.user); });
  return {n:v.length,a,b,na:v.filter(x=>x.side==='A').length,nb:v.filter(x=>x.side==='B').length};
}
function resolvePos(sp){
  const st=posState(sp), tot=st.a+st.b;
  if(st.n<NEED_VOTES) return;
  let res=null;
  if(st.b/tot>=ADOPT_RATIO) res='B';
  else if(st.a/tot>=ADOPT_RATIO) res='A';
  else if(st.n>=TIE_VOTES) res='A';                  // 割れたままなら、元の位置のまま
  if(!res) return;
  const pr=sp.prop;
  if(res==='B'){
    sp.lat=pr.lat; sp.lng=pr.lng;
    const m=markers.get(sp.id); if(m) m.m.setLatLng([sp.lat,sp.lng]);
    (S.users[pr.by]=S.users[pr.by]||{confi:0}).confi+=POS_CONFI;
    toast(`📍 ピンの位置が更新されました（${pr.by}さんの提案が採用）`);
  }else toast('📍 確認の結果、ピンの位置はそのままになりました');
  sp.lockUntil=Date.now()+COOLDOWN_DAYS*86400e3; sp.prop=null; save(); renderHead(); renderTL();
}
function addPosVote(sp,user,side){
  if(!sp.prop||sp.prop.votes.some(x=>x.user===user)) return false;
  sp.prop.votes.push({user,side}); save(); resolvePos(sp); return true;
}
function canVotePos(sp){
  return sp.prop && sp.prop.by!==S.me && sp.creator!==S.me && !sp.prop.votes.some(v=>v.user===S.me) && !!S.arrivals[sp.id+'|'+ym()];
}
function posBlock(sp){
  if(sp.prop){

function maybeAskPos(id){ const sp=S.spots[id]; if(sp && canVotePos(sp)) setTimeout(()=>askPos(id),350); else maybeAskMain(id); }
function askPos(id){
  const sp=S.spots[id]; if(!sp||!sp.prop) return;
  const A={lat:sp.lat,lng:sp.lng}, B={lat:sp.prop.lat,lng:sp.prop.lng};
  const kx=111320*Math.cos(A.lat*Math.PI/180), ky=110540;
  const bx=(B.lng-A.lng)*kx, by=-(B.lat-A.lat)*ky;
  const W=280,H=150,pad=34, sc=Math.min((W-2*pad)/Math.max(Math.abs(bx),1),(H-2*pad)/Math.max(Math.abs(by),1),6);
  const cx=W/2-bx*sc/2, cy=H/2-by*sc/2, ax=cx, ay=cy, px=cx+bx*sc, py=cy+by*sc;
  modal(`<h2>ピンの位置は、どちらが正確ですか？</h2>
    <p>${esc(sp.name)}（2つの位置は ${fmtD(dist(A,B))} 離れています）</p>
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="background:var(--bg);border-radius:12px;margin:8px 0">
      <line x1="${ax}" y1="${ay}" x2="${px}" y2="${py}" stroke="#aeb6c4" stroke-dasharray="4 4"/>
      <circle cx="${ax}" cy="${ay}" r="9" fill="#8d97aa"/><text x="${ax}" y="${ay+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">A</text>
      <circle cx="${px}" cy="${py}" r="9" fill="#ff6a3d"/><text x="${px}" y="${py+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">B</text>
    </svg>
    <p class="note">いま現地にいるあなたの感覚で選んでください。A：いまのピン　B：提案された位置</p>
    <div class="row"><button class="btn" data-s="A">A いまの位置</button><button class="btn pri" data-s="B">B 提案の位置</button></div>
    <button class="link" id="m-x">わからない・あとで</button>`);
  $('#m-x').onclick=()=>{ closeModal(); maybeAskMain(id); };
  $('#modal').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
    const ok=addPosVote(sp,S.me,b.dataset.s); closeModal();
    if(ok && sp.prop) toast('回答ありがとう！みんなの回答で位置が決まります');
    refreshSheet(); maybeAskMain(id);
  });
}

/* ===== メインタグ：到着した人の認知で、お店の「いちばんの顔」が決まる ===== */
function mvState(sp){
  const v=(sp.mv&&sp.mv.votes)||[], w={}, n={}; let tot=0;
  v.forEach(x=>{ const k=vw(x.user); w[x.tag]=(w[x.tag]||0)+k; n[x.tag]=(n[x.tag]||0)+1; tot+=k; });
  return {n:v.length,w,cnt:n,tot};
}
function canVoteMain(sp){
  return (sp.subs||[]).length>=2 && !(sp.mainLock>Date.now()) && !!S.arrivals[sp.id+'|'+ym()] && !((sp.mv&&sp.mv.votes)||[]).some(v=>v.user===S.me);
}
function resolveMain(sp){
  const st=mvState(sp); if(st.n<NEED_VOTES) return;
  const ranked=Object.keys(st.w).sort((a,b)=>st.w[b]-st.w[a]);
  const top=ranked[0], share=st.w[top]/st.tot;
  let win=null;
  if(share>=ADOPT_RATIO) win=top;
  else if(st.n>=TIE_VOTES) win=sp.subs[0];            // 割れたままなら、いまのメインタグのまま
  if(!win) return;
  if(win!==sp.subs[0]){
    sp.subs=[win].concat(sp.subs.filter(x=>x!==win));
    sp.extraMains=(sp.extraMains||[]).filter(x=>x!==win);
    toast(`🏷️ メインタグが「${win}」に決まりました`);
  }else toast(`🏷️ 確認の結果、メインタグは「${win}」のままです`);
  sp.mainLock=Date.now()+COOLDOWN_DAYS*86400e3; sp.mv={votes:[]}; save(); syncMarkers(); renderTL();
}
function addMainVote(sp,user,tag){
  sp.mv=sp.mv||{votes:[]};
  if(sp.mv.votes.some(v=>v.user===user)||!(sp.subs||[]).includes(tag)) return false;
  sp.mv.votes.push({user,tag}); save(); resolveMain(sp); return true;
}
function tagBlock(sp){
  const subs=sp.subs||[]; let h='';
  if(subs.length>=2){
    const st=mvState(sp), left=Math.max(NEED_VOTES-st.n,0);
    const locked=sp.mainLock>Date.now()?Math.ceil((sp.mainLock-Date.now())/86400e3):0;
    h+=`<div class="pos"><b class="t">🏷️ いちばんの顔（メインタグ）：${esc(subs[0])}</b>
      <div class="note">お店のメインは、行った人の感覚で決まります。（例：居酒屋が主でランチもある／定食が主で夜はお酒も飲める）</div>
      <div class="nums" style="flex-wrap:wrap;gap:4px 12px;margin-top:6px">${subs.map(x=>`<span>${esc(x)} ${st.cnt[x]||0}票</span>`).join('')}</div>
      <div class="note" style="margin-top:4px">${locked?`確認済みです（あと${locked}日は、新しく決め直せません）`:`あと${left}票で決着`}</div>
      <div class="row">${canVoteMain(sp)?'<button class="btn sm pri" id="tg-ask">どれがいちばん？</button>':''}</div>
      ${locked?'':`<div class="row">${subs.map(x=>`<button class="link" data-mv="${esc(x)}">🧪 誰かが「${esc(x)}」に投票</button>`).join('')}</div>`}</div>`;
  }
  const avail=MAINS[sp.cat].subs.filter(x=>!subs.includes(x));
  if((S.arrivals[sp.id+'|'+ym()]||demoOn()) && subs.length<MAX_TAGS && avail.length){
    h+=`<div class="row" style="align-items:center"><select id="tg-sel" style="flex:1">${avail.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select><button class="btn sm" id="tg-add">＋ タグを追加</button></div>`;
  }
  return h;
}
function ownerBlock(sp){
  if(sp.cat!=='eat') return '';   // メインタグの拡張は、いまは飲食店のオーナーだけ
  if(sp.owner===S.me){
    const extra=(sp.extraMains||[]), slots=OWNER_MAIN_MAX-1;
    return `<div class="pos" style="border-style:solid;border-color:var(--ink);background:var(--bg)"><b class="t">🏪 オーナー設定</b>
      <div class="note">メインタグを、みんなが決めた「${esc(sp.subs[0]||'')}」に加えて、最大${OWNER_MAIN_MAX}つまで広げられます（あと${slots-extra.length}つ）。</div>
      <div class="chips" id="ow-chips">${MAINS[sp.cat].subs.filter(x=>x!==sp.subs[0]).map(x=>`<button data-x="${esc(x)}" class="${extra.includes(x)?'on':''}">${esc(x)}</button>`).join('')}</div></div>`;
  }
  return sp.owner?'<div class="pos-note">🏪 オーナー確認済み</div>':'<button class="link" id="ow-become">🧪 デモ：このお店のオーナーになる（本番は契約と本人確認が必要）</button>';
}
function demoMainVote(id,tag){

function maybeAskMain(id){ const sp=S.spots[id]; if(sp && canVoteMain(sp)) setTimeout(()=>askMain(id),350); else maybeAskAttr(id,0); }

/* ===== 喫煙ルール・駐車場：到着した人の回答で決まる ===== */
const avList = (sp,k) => ((sp.av&&sp.av[k]&&sp.av[k].votes)||[]);
const avLocked = (sp,k) => ((sp.alock&&sp.alock[k])||0) > Date.now();
function avState(sp,k){
  const w={}, c={}; let tot=0;
  avList(sp,k).forEach(x=>{ const m=vw(x.user); w[x.v]=(w[x.v]||0)+m; c[x.v]=(c[x.v]||0)+1; tot+=m; });
  return {n:avList(sp,k).length,w,c,tot};
}
function canVoteAttr(sp,k){
  return !avLocked(sp,k) && !!S.arrivals[sp.id+'|'+ym()] && !avList(sp,k).some(v=>v.user===S.me);
}
function resolveAttr(sp,k){
  const st=avState(sp,k); if(st.n<NEED_VOTES) return;
  const top=Object.keys(st.w).sort((a,b)=>st.w[b]-st.w[a])[0];
  let win=null;
  if(st.w[top]/st.tot>=ADOPT_RATIO) win=top;
  else if(st.n<TIE_VOTES) return;
  if(win && win!==sp[k]){ sp[k]=win; toast(`${ATTRS[k].title}が「${ATTRS[k].opts[win]}」に決まりました`); }
  else toast(`${ATTRS[k].title}は、いまのままです`);
  sp.alock=sp.alock||{}; sp.alock[k]=Date.now()+COOLDOWN_DAYS*86400e3;
  sp.av=sp.av||{}; sp.av[k]={votes:[]}; save(); syncMarkers(); renderTL();
}
function addAttrVote(sp,k,user,v){
  sp.av=sp.av||{}; sp.av[k]=sp.av[k]||{votes:[]};
  if(sp.av[k].votes.some(x=>x.user===user)||!ATTRS[k].opts[v]) return false;
  sp.av[k].votes.push({user,v}); save(); resolveAttr(sp,k); return true;
}
function attrBlock(sp,k){
  const A=ATTRS[k], st=avState(sp,k), left=Math.max(NEED_VOTES-st.n,0), lk=avLocked(sp,k);
  const days=lk?Math.ceil((sp.alock[k]-Date.now())/86400e3):0;
  return `<div class="pos"><b class="t">${A.ico} ${A.title}：${sp[k]?esc(A.opts[sp[k]]):'未登録'}</b>
    <div class="nums" style="flex-wrap:wrap;gap:4px 12px;margin-top:6px">${Object.keys(A.opts).map(o=>`<span>${esc(A.opts[o])} ${st.c[o]||0}票</span>`).join('')}</div>
    <div class="note" style="margin-top:4px">行った人の回答で決まります。${lk?`確認済み（あと${days}日は決め直せません）`:`あと${left}票で決着`}</div>
    <div class="row">${canVoteAttr(sp,k)?`<button class="btn sm pri" data-ask="${k}">${A.title}を回答</button>`:''}</div>
    ${lk?'':`<div class="row">${Object.keys(A.opts).map(o=>`<button class="link" data-av="${k}|${o}">🧪 誰かが「${esc(A.opts[o])}」</button>`).join('')}</div>`}</div>`;
}
function demoAttrVote(id,k,v){
  const sp=S.spots[id]; if(!sp) return;
  const used=avList(sp,k).map(x=>x.user);
  const u=MOCKS.find(x=>!used.includes(x));
  if(!u){ toast('デモの投票者がもういません'); return; }
  addAttrVote(sp,k,u,v); refreshSheet();
}
function maybeAskAttr(id,from){
  const sp=S.spots[id]; if(!sp) return;
  for(let i=from||0;i<ATTR_KEYS.length;i++){ if(attrActive(sp,ATTR_KEYS[i],true) && canVoteAttr(sp,ATTR_KEYS[i])){ const k=ATTR_KEYS[i]; setTimeout(()=>askAttr(id,k),350); return; } }
}
function askAttr(id,k){
  const sp=S.spots[id]; if(!sp) return; const A=ATTRS[k], next=ATTR_KEYS.indexOf(k)+1;
  modal(`<h2>${A.ico} このお店の${A.title}は？</h2><p>${esc(sp.name)}</p>
    <p class="note">行ったあなたが見た範囲で、選んでください。</p>
    ${Object.keys(A.opts).map(o=>`<button class="pick" data-v="${o}"><b>${esc(A.opts[o])}</b></button>`).join('')}
    <button class="link" id="m-x">わからない・あとで</button>`);
  $('#m-x').onclick=()=>{ closeModal(); maybeAskAttr(id,next); };
  $('#modal').querySelectorAll('.pick').forEach(b=>b.onclick=()=>{
    const ok=addAttrVote(sp,k,S.me,b.dataset.v); closeModal();
    if(ok && !avLocked(sp,k)) toast(`回答ありがとう！みんなの回答で${A.title}が決まります`);
    refreshSheet(); maybeAskAttr(id,next);
  });
}

/* 到着 → 滞在 → 決めた！ */
function startArrive(id){
  const sp=spotData(id), d=dist(S.pos,sp);
  if(d>ARRIVE_M){
    modal(`<h2>まだ到着していません</h2><p>${esc(sp.name)} から <b>${ARRIVE_M}m以内</b>で「到着」できます。いまは ${fmtD(d)} 離れています。</p>
      <div class="row"><button class="btn" id="m-nav">🧭 経路案内</button><button class="btn" id="m-tp">🧪 デモ：移動する</button></div><button class="link" id="m-x">閉じる</button>`);
    $('#m-x').onclick=closeModal;
    $('#m-nav').onclick=()=>window.open(`https://www.google.com/maps/dir/?api=1&destination=${sp.lat},${sp.lng}&travelmode=walking`,'_blank');
    $('#m-tp').onclick=()=>{ setPos(sp.lat+0.00005,sp.lng+0.00005); closeModal(); toast('移動しました。もう一度「到着した」を押してください'); };
    return;
  }
  const k=id+'|'+ym();
  if(S.arrivals[k]){
    modal(`<h2>今月はすでに到着済みです</h2><p>同じスポットの到着は<b>月に1回</b>までカウントされます。</p><button class="btn" id="m-x" style="width:100%">閉じる</button>`);
    $('#m-x').onclick=closeModal; return;
  }
  closeModal.lock=true;
  const R=60, C=2*Math.PI*R; let left=DWELL_SEC;
  modal(`<h2>滞在を確認しています</h2><p>${esc(sp.name)} に ${DWELL_SEC}秒 いると到着になります<br><span class="note">（本番は1分。自宅付近の判定も入ります）</span></p>
    <div class="ring"><svg width="140" height="140"><circle cx="70" cy="70" r="${R}" fill="none" stroke="#e3e7ee" stroke-width="10"/><circle id="rg" cx="70" cy="70" r="${R}" fill="none" stroke="#ff6a3d" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1s linear"/></svg><div class="t" id="rt">${left}</div></div>
    <button class="link" id="m-x">キャンセル</button>`);
  $('#m-x').onclick=()=>{ closeModal.lock=false; closeModal(); };
  setTimeout(()=>{ const g=$('#rg'); if(g) g.style.strokeDashoffset=C*(left-1)/DWELL_SEC; },30);
  closeModal._t=setInterval(()=>{
    left--; const t=$('#rt'), g=$('#rg');
    if(t) t.textContent=Math.max(left,0); if(g) g.style.strokeDashoffset=C*Math.max(left-1,0)/DWELL_SEC;
    if(left<=0){
      clearInterval(closeModal._t); closeModal.lock=false;
      S.arrivals[k]=1; sp.checkins=(sp.checkins||0)+1; save(); showKime(id); renderHead(); refreshSheet();
    }
  },1000);
}
function showKime(id){
  const sp=spotData(id);
  const list=sp.reports.filter(r=>r.user!==S.me);
  if(!list.length){
    modal(`<div class="big">🎉</div><h2 style="text-align:center">到着しました！</h2><p style="text-align:center">今月のチェックインをカウントしました。<br>このスポットには他の人のルポがまだありません。</p><button class="btn" id="m-x" style="width:100%;margin-top:10px">閉じる</button>`);
    $('#m-x').onclick=()=>{ closeModal(); maybeAskPos(id); }; return;
  }
  modal(`<div class="big">🎉</div><h2 style="text-align:center">到着しました！</h2>
    <p style="text-align:center;margin-bottom:10px">ここに来ると<b>決めた</b>きっかけになったルポに、<b>「決めた！」</b>を1つ贈ろう。</p>
    ${list.map(r=>`<button class="pick" data-r="${r.id}"><span class="rp-top"><span class="av" style="--c:${avColor(r.user)}">${esc(r.user[0])}</span><span class="rp-user">${esc(r.user)}</span><span class="cf">コンフィ ${conf(r.user)}</span></span><span style="display:block;margin-top:4px">${esc(r.text)}</span><span class="go">🎯 決めた！</span></button>`).join('')}
    <button class="link" id="m-x">きっかけは別にある・あとで</button>`);
  $('#m-x').onclick=()=>{ closeModal(); maybeAskPos(id); };
  $('#modal').querySelectorAll('.pick').forEach(b=>b.onclick=()=>{
    const r=sp.reports.find(x=>x.id===b.dataset.r); if(!r) return;
    r.likes++; (S.users[r.user]=S.users[r.user]||{confi:0}).confi+=KIME_CONFI; save();
    closeModal(); toast(`🎯 決めた！を贈りました。${r.user}さんのコンフィ +${KIME_CONFI}`); refreshSheet(); renderHead(); maybeAskPos(id);
  });
}

/* ===== タイムライン ===== */
function renderTL(){
  const el=$('#tl'); if(!el) return;
  const items=[]; Object.values(S.spots).filter(matches).forEach(sp=>sp.reports.forEach(r=>items.push({r,sp,d:dist(S.pos,sp)})));
  let rad=500; const steps=[500,1000,2000,5000,10000,30000];
  for(const s of steps){ rad=s; if(items.filter(i=>i.d<=s).length>=5) break; }
  const list=items.filter(i=>i.d<=rad).sort((a,b)=>b.r.t-a.r.t);
  el.innerHTML=`<div class="tl-head"><b>近くのルポ</b><span>半径 ${rad>=1000?rad/1000+'km':rad+'m'} 以内（${list.length}件）</span></div>`+
    (list.length?list.map(i=>`<div data-s="${i.sp.id}" style="cursor:pointer">${reportCard(i.r,{spot:i.sp.name,d:i.d})}</div>`).join(''):'<div class="empty">近くにルポがありません。最初のルポルターになろう！</div>')+
    `<p class="note">地図で選んだジャンル（${MAINS[flt().main].l}${flt().sub?' › '+flt().sub:''}）のルポだけを表示しています。件数が少ないときは、半径が自動で広がります。</p>`;
  el.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{ showView('map'); const sp=S.spots[e.dataset.s]; map.setView([sp.lat,sp.lng],17); openSheet(sp.id); });
}

/* ===== マイページ ===== */
function renderHead(){ $('#hd-confi').textContent='コンフィ '+conf(S.me); }
function renderMe(){
  const el=$('#me'), c=conf(S.me);
  const mine=[]; let created=0, got=0, arr=Object.keys(S.arrivals).length;
  Object.values(S.spots).forEach(sp=>{ if(sp.creator===S.me) created++; sp.reports.forEach(r=>{ if(r.user===S.me){ mine.push({r,sp}); got+=r.likes; } }); });
  const nxt=c<50?50:c<200?200:c<500?500:null, pct=nxt?Math.min(100,c/nxt*100):100;
  el.innerHTML=`<div class="hero"><div class="rank">${rankOf(c)}</div><div class="nm">${esc(S.me)}</div>
    <div class="pt">${c}<small>コンフィ</small></div><div class="bar"><i style="width:${pct}%"></i></div>
    <div class="rank" style="margin-top:6px">${nxt?`あと ${nxt-c} で次のランク`:'最高ランクです'} ／ 収益化プログラムは ${c>=300?'<b>対象です</b>':'コンフィ300から（仮）'}</div></div>
    <div class="grid4"><div class="stat"><b>${created}</b>作ったスポット</div><div class="stat"><b>${mine.length}</b>ルポ</div><div class="stat"><b>${got}</b>決めた！</div><div class="stat"><b>${arr}</b>到着</div></div>
    <div class="card"><h4>あなたのルポ</h4>${mine.length?mine.sort((a,b)=>b.r.t-a.r.t).map(m=>`<div>${reportCard(m.r,{spot:m.sp.name})}<button class="link" data-demo="${m.r.id}|${m.sp.id}">🧪 デモ：誰かが「決めた！」を押す</button></div>`).join(''):'<div class="empty">まだルポがありません。地図のグレーの印をタップして、最初のルポを書いてみましょう。</div>'}</div>
    <div class="card sim"><h4>💰 収益分配シミュレーター（将来構想）</h4>
      <div class="note">アプリ全体の広告収益を、チェックインに応じて各スポットに割り振り、貢献者に分配します。</div>
      <label>アプリ全体の広告収益<b id="v1"></b></label><input type="range" id="s1" min="100" max="10000" step="100" value="1000">
      <label>アプリ全体の総チェックイン数<b id="v2"></b></label><input type="range" id="s2" min="100" max="10000" step="100" value="1000">
      <label>このスポットのチェックイン数<b id="v3"></b></label><input type="range" id="s3" min="10" max="10000" step="10" value="1000">
      <label>オーナー契約あり<input type="checkbox" id="s4" checked></label>
      <table id="sim-t"></table>
      <div class="note" style="margin-top:6px">※ 金額は仮の計算です。実際の支払いは、法務・税務を確認してから始めます。</div></div>
    <div class="card"><h4>🧪 試作用の設定</h4><label class="sw"><span>場所の制限なしで、最初のルポを書ける<br><span class="note">本番では、この1週間に訪れた場所の近く（150m以内）に、あとからでも作れます。</span></span><input type="checkbox" id="demo-sw" ${demoOn()?'checked':''}></label></div>
    <div class="card"><h4>しくみ</h4><div class="note">・喫煙ルール（禁煙／分煙／喫煙可。分煙・喫煙可は、電子のみ／紙OKも）と駐車場（あり／提携／なし）は、到着した人の回答で決まる。地図のボタンで絞り込める<br>・スポットには、メインタグ（ジャンル）がひとつと、サブタグが複数ある。地図は、選んだジャンルだけを表示する<br>・お店のいちばんの顔（メインタグ）は、到着した人の回答で決まる。飲食店のオーナーは、メインタグを最大3つまで広げられる<br>・同じスポットの到着は月1回までカウント<br>・到着後、決め手になったルポに「決めた！」を1つ贈る<br>・「決めた！」を受け取ったルポ主のコンフィが上がる<br>・メイン情報は「決めた！」数 × 書いた人のコンフィで自動決定<br>・ピンの位置は誰でも提案でき、30m以上ずれていたら到着した人が「どちらが正確？」に答えて、多いほうを採用</div></div>
    <button class="link" id="reset">🧪 デモデータを最初に戻す</button>`;
  el.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{
    const [rid_,sid]=b.dataset.demo.split('|'), r=S.spots[sid].reports.find(x=>x.id===rid_);
    r.likes++; S.users[S.me].confi+=KIME_CONFI; save(); renderHead(); renderMe(); toast('🎯 誰かが決めた！を押しました。コンフィ +'+KIME_CONFI);
  });
  $('#demo-sw').onchange=e=>{ S.demo=e.target.checked; save(); toast(S.demo?'どこでも最初のルポを書けます':'この1週間に訪れた場所の近くだけ書けます'); };
  $('#reset').onclick=()=>{ if(confirm('デモデータを最初の状態に戻しますか？')){ try{localStorage.removeItem(KEY);}catch(e){} location.reload(); } };
  const f=n=>n.toLocaleString('ja-JP');
  const sim=()=>{
    const rev=+$('#s1').value*1e4, tot=+$('#s2').value*1e4, chk=+$('#s3').value, own=$('#s4').checked;
    $('#v1').textContent=f(rev/1e4)+'万円'; $('#v2').textContent=f(tot/1e4)+'万'; $('#v3').textContent=f(chk);
    const pool=Math.round(rev*chk/tot), ops=pool*.5, cr=pool*.05, ow=own?pool*.05:0, rep=pool-ops-cr-ow;
    $('#sim-t').innerHTML=`<tr><td>このスポットの収益</td><td>${f(pool)}円</td></tr><tr><td>運営 50%</td><td>${f(ops)}円</td></tr><tr><td>スポット作成者 5%</td><td>${f(cr)}円</td></tr><tr><td>オーナー ${own?'5%':'（未契約）'}</td><td>${f(ow)}円</td></tr><tr><td>ルポルターで山分け ${own?'40%':'45%'}</td><td>${f(rep)}円</td></tr><tr><td class="note">例：決めた！ 6:4 のふたり</td><td class="note">${f(rep*.6)}円 ／ ${f(rep*.4)}円</td></tr>`;
  };
  ['s1','s2','s3','s4'].forEach(i=>$('#'+i).oninput=sim); sim();
}

/* ===== 起動 ===== */
if(S.spots.d2 && !S.spots.d2.posSeeded){
  const d2=S.spots.d2; d2.posSeeded=true;
  d2.prop={lat:d2.lat+0.0005,lng:d2.lng+0.0002,by:'ケン',t:Date.now()-3600e3,votes:[{user:'ソウタ',side:'B'},{user:'リン',side:'A'}]};
}
if(S.spots.d2 && !S.spots.d2.tagSeeded){ const d=S.spots.d2; d.tagSeeded=true; if(!d.subs.includes('居酒屋・バー')) d.subs.push('居酒屋・バー'); }
if(S.spots.d5 && !S.spots.d5.tagSeeded){
  const d=S.spots.d5; d.tagSeeded=true; if(!d.subs.includes('居酒屋・バー')) d.subs.push('居酒屋・バー');
  d.mv={votes:[{user:'ハナ',tag:d.subs[0]},{user:'リン',tag:'居酒屋・バー'}]};
}
if(!S.attrSeeded){
  S.attrSeeded=true;
  const sd={d1:['no','none'],d2:['sep','partner'],d3:[null,'none'],d5:['sep','own'],d6:['no','none']};
  Object.keys(sd).forEach(k=>{ const sp=S.spots[k]; if(!sp) return; if(sp.smoke===undefined) sp.smoke=sd[k][0]; if(sp.parking===undefined) sp.parking=sd[k][1]; });
}
recordVisit(S.pos.lat,S.pos.lng); save();
renderHead(); renderFilter(); syncMarkers(); renderTL(); onMove();
setTimeout(()=>map.invalidateSize(),100);
})();
</script>
</body>
</html>
