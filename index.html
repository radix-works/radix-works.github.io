<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radix Works</title>
<style>
:root { --ground:#eceff3; --paper:#fbfcfd; --ink:#1b2436; --sub:#4a5468; --gold:#8f7a4c; --wine:#823b4a; }
* { box-sizing: border-box; }
body { margin:0; background:var(--ground); color:var(--ink); font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif; line-height:1.8; }
main { max-width: 640px; margin: 0 auto; padding: 48px 18px 64px; }
.brand { color: var(--gold); letter-spacing: .2em; font-size: 12px; font-weight: 700; }
h1 { font-size: 28px; margin: 4px 0 24px; }
.card { background:var(--paper); border:1.5px solid var(--ink); border-radius:6px; box-shadow:0 3px 0 var(--ink); padding: 18px 20px; }
.card h2 { font-size: 18px; margin: 0 0 6px; }
a { color: var(--wine); }
footer { margin-top: 32px; color: var(--sub); font-size: 13px; }
</style>
</head>
<body>
<main>
<div class="brand">RADIX WORKS</div>
<h1>Radix Works</h1>
<div class="card">
<h2>デックマッチ</h2>
<p><a href="deckmatch/privacy/">プライバシーポリシー</a></p>
</div>
<footer>お問い合わせ：radixworks.support@gmail.com</footer>
</main>
</body>
</html>
